name: CI/CD
on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '04 23 * * 1'
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  Install-Ubuntu-NonRoot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - name: "Set environmental variables"
        run: |
          echo "INSTALLER_PATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      - name: Install tools
        run: |
          sudo apt -y update
          sudo apt install -y gcc-multilib
      - name: Run the installation script
        run: |
          cd $INSTALLER_PATH
          ./galacticusInstall.sh --galacticusPrefix=$INSTALLER_PATH/galacticus --toolPrefix=$INSTALLER_PATH/install --asRoot=no --cores=4 --installLevel=minimal --setBash=yes --setCShell=no --ignoreFailures=no --packageManager=no --catLogOnError=yes --cleanUp=yes
  Install-Rocky-Root:
    runs-on: ubuntu-latest
    container:
      image: rockylinux/rockylinux:9
      options: --privileged
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - name: "Set environmental variables"
        run: |
          echo "INSTALLER_PATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      - name: Run the installation script
        run: |
          cd $INSTALLER_PATH
          ./galacticusInstall.sh --galacticusPrefix=$INSTALLER_PATH/galacticus --toolPrefix=$INSTALLER_PATH/install --asRoot=yes --cores=4 --installLevel=minimal --setBash=yes --setCShell=no --ignoreFailures=no --packageManager=yes --catLogOnError=yes --cleanUp=yes
  Install-MacOS:
    strategy:
      # Ensure all jobs are run, even if some fail.
      fail-fast: false
      matrix:
        # macos-14 is excluded: the hosted GCC 16 binary requires the macOS 15.4+ SDK (its fixincludes <_stdio.h>
        # references <_bounds.h>), but the macos-14 runner image only provides up to Xcode 16.2 (macOS 15.2 SDK).
        version: [ macos-15, macos-15-intel ]
    runs-on: ${{ matrix.version }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - name: "Set environmental variables"
        run: |
          echo "INSTALLER_PATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      - name: Run the installation script
        run: |
          cd $INSTALLER_PATH
          ./galacticusInstallMacOS.sh
